# Local development stack only.
# SECURITY: default credentials are weak; change them before any shared network use.
# Database and cache ports bind to loopback by default (override via *_HOST_BIND env vars).
services:
  postgres:
    image: postgres:16-alpine
    container_name: masterfabric-postgres
    environment:
      POSTGRES_USER: masterfabric
      POSTGRES_PASSWORD: masterfabric
      POSTGRES_DB: masterfabric
    ports:
      - "${DB_HOST_BIND:-0.0.0.0}:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masterfabric"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: masterfabric-redis
    ports:
      - "${REDIS_HOST_BIND:-0.0.0.0}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: masterfabric-kafka
    ports:
      - "${KAFKA_HOST_BIND:-0.0.0.0}:${KAFKA_PORT:-9092}:9092"
    environment:
      # KRaft single-node setup
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-192.168.1.100}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: "MasterfabricKafkaClusterId1"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: masterfabric-kafka-ui
    ports:
      - "${KAFKA_UI_HOST_BIND:-0.0.0.0}:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: masterfabric
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # =============================================
  # Ollama AI Model Services (Dual Instance)
  # =============================================
  # Two separate Ollama instances for Analyst and Verifier agents.
  # Each can run different models, enabling admin panel hot-swap.
  # GPU support is optional: Docker ignores deploy.resources without nvidia-container-toolkit.

  ollama-analyst:
    image: ollama/ollama:latest
    container_name: claimpilot-ollama-analyst
    ports:
      - "${OLLAMA_ANALYST_HOST_BIND:-0.0.0.0}:${OLLAMA_ANALYST_PORT:-11434}:11434"
    environment:
      OLLAMA_MODEL: "${OLLAMA_ANALYST_MODEL:-gemma2:2b}"
      OLLAMA_HOST: "0.0.0.0"
    volumes:
      - ollama_analyst_data:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ollama-verifier:
    image: ollama/ollama:latest
    container_name: claimpilot-ollama-verifier
    ports:
      - "${OLLAMA_VERIFIER_HOST_BIND:-0.0.0.0}:${OLLAMA_VERIFIER_PORT:-11435}:11434"
    environment:
      OLLAMA_MODEL: "${OLLAMA_VERIFIER_MODEL:-gemma2:2b}"
      OLLAMA_HOST: "0.0.0.0"
    volumes:
      - ollama_verifier_data:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # MongoDB for ClaimPilot document & obligation storage
  mongodb:
    image: mongo:7-jammy
    container_name: claimpilot-mongodb
    ports:
      - "${MONGO_HOST_BIND:-0.0.0.0}:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  kafkadata:
  ollama_analyst_data:
  ollama_verifier_data:
  mongodata:
